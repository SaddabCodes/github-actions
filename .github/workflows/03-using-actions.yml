name: 03 - using-actions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: using-actions/react-with-github-actions

    steps:
      # 1. Checkout the code from repository
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: using-actions/react-with-github-actions/package-lock.json

      # 2. Install dependency of React app
      - name: Install Dependencies
        run: npm ci

      # 3. Run the checks provided by the app
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
